<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de insumos médicos y textiles hospitalarios | Medical Investments R.M.</title>
<meta name="description" content="Catálogo de insumos médicos, desechables, curación, compresión y textiles.">
<meta name="theme-color" content="#0A5F27">
<link rel="canonical" href="https://www.medicalinvestmentsrm.com/tienda/">
<meta property="og:title" content="Catálogo de insumos médicos | Medical Investments R.M.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.medicalinvestmentsrm.com/img/logo.png">
<link rel="icon" href="../img/favicon.png" type="image/png">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body data-base="../" data-page="shop">

<main>
  <div class="page-head"><div class="container">
    <span class="eyebrow">Catálogo</span>
    <h1 style="font-size:clamp(2rem,5vw,3.6rem);margin-top:.8rem">Tienda</h1>
    <p class="lead">Encuentra el insumo que necesitas, filtrando por categoría o buscando por nombre.</p>
  </div></div>

  <div class="container shop">
    <div>
      <button class="btn btn-dark filter-toggle" id="filterToggle">Filtros</button>
      <aside class="filters" id="filters">
        <div><h4>Buscar</h4><input type="search" id="search" placeholder="Ej. media, bata, algodón…" aria-label="Buscar"></div>
        <div><h4>Categorías</h4><div class="chip-list" id="cats"></div></div>
        <div><h4>Ordenar</h4>
          <select id="sort" aria-label="Ordenar"><option value="rel">Relevancia</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="az">Nombre A–Z</option></select>
        </div>
      </aside>
    </div>
    <section>
      <div class="toolbar"><span id="count"></span><span>Envíos a todo el país</span></div>
      <div class="grid" id="grid"></div>
      <div class="pagination" id="pager"></div>
    </section>
  </div>
</main>

<script src="../js/main.js" defer></script>
</body>
</html>
